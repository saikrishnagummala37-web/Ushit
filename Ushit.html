<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Your Content | Follower Submissions</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #1e293b;
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 24px;
            color: #f43f5e;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            color: #94a3b8;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #cbd5e1;
        }

        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        textarea:focus {
            border-color: #f43f5e;
        }

        /* Drag & Drop Upload Zone */
        .upload-zone {
            border: 2px dashed #475569;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            background: #0f172a;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .upload-zone:hover, .upload-zone.dragover {
            border-color: #f43f5e;
            background: #1e1b4b;
        }

        .upload-zone p {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 6px;
        }

        #file-input {
            display: none;
        }

        .file-preview {
            margin-top: 10px;
            font-size: 13px;
            color: #38bdf8;
            word-break: break-all;
        }

        /* Declarations & Copyright Checkboxes */
        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 12px;
        }

        .checkbox-group input {
            margin-top: 3px;
            accent-color: #f43f5e;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .checkbox-group label {
            font-size: 12px;
            color: #94a3b8;
            font-weight: normal;
            line-height: 1.4;
            cursor: pointer;
        }

        /* Submit Button */
        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            opacity: 0.9;
        }

        #status-msg {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Submit Your Media</h1>
        <p>Send your photos & videos to get featured on my Instagram page!</p>
    </div>

    <!-- Replace 'YOUR_FORM_ENDPOINT' with a Formspree / Web3Forms endpoint -->
    <form id="submission-form" action="https://formspree.io/f/YOUR_FORM_ENDPOINT" method="POST" enctype="multipart/form-data">
        
        <!-- Sender Name -->
        <div class="form-group">
            <label for="name">Your Name / Alias *</label>
            <input type="text" id="name" name="sender_name" placeholder="e.g. Alex Smith" required>
        </div>

        <!-- Instagram Handle -->
        <div class="form-group">
            <label for="insta_id">Instagram Handle (@) *</label>
            <input type="text" id="insta_id" name="instagram_handle" placeholder="@yourusername" required>
        </div>

        <!-- Email (Optional) -->
        <div class="form-group">
            <label for="email">Email Address (Optional)</label>
            <input type="email" id="email" name="sender_email" placeholder="name@example.com">
        </div>

        <!-- Media Upload Zone -->
        <div class="form-group">
            <label>Upload Media (Photos / Videos) *</label>
            <div class="upload-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
                <svg width="36" height="36" fill="none" stroke="#f43f5e" viewBox="0 0 24 24" style="margin: 0 auto 8px auto; display: block;">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                </svg>
                <strong>Click to browse</strong> or drag & drop files here
                <p>MP4, MOV, JPG, PNG up to 50MB</p>
                <input type="file" id="file-input" name="attachment" accept="image/*,video/*" required>
            </div>
            <div class="file-preview" id="file-preview"></div>
        </div>

        <!-- Optional Description / Caption -->
        <div class="form-group">
            <label for="caption">Suggested Caption / Context (Optional)</label>
            <textarea id="caption" name="media_caption" rows="3" placeholder="Tell us about this clip/photo or tag friends..."></textarea>
        </div>

        <!-- Copyright & Licensing Declarations -->
        <div class="form-group">
            <div class="checkbox-group">
                <input type="checkbox" id="decl-owner" name="decl_owner" required>
                <label for="decl-owner">I declare that I am the sole creator/owner of this content or have explicit permission to share it.</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="decl-copyright" name="decl_copyright" required>
                <label for="decl-copyright">I confirm that this media does not infringe on any third-party copyright, trademark, or privacy rights.</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="decl-license" name="decl_license" required>
                <label for="decl-license">I grant permission for this media to be edited, posted, and reshared across the Instagram handle provided.</label>
            </div>
        </div>

        <button type="submit">Submit Content</button>
        <div id="status-msg"></div>
    </form>
</div>

<script>
    const fileInput = document.getElementById('file-input');
    const dropZone = document.getElementById('drop-zone');
    const filePreview = document.getElementById('file-preview');

    // Display selected file name
    fileInput.addEventListener('change', () => {
        if (fileInput.files.length > 0) {
            filePreview.textContent = `Selected File: ${fileInput.files[0].name} (${(fileInput.files[0].size / (1024 * 1024)).toFixed(2)} MB)`;
        } else {
            filePreview.textContent = '';
        }
    });

    // Drag and Drop Effects
    ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
        }, false);
    });

    dropZone.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        const files = dt.files;
        if (files.length > 0) {
            fileInput.files = files;
            filePreview.textContent = `Selected File: ${files[0].name} (${(files[0].size / (1024 * 1024)).toFixed(2)} MB)`;
        }
    });
</script>

</body>
</html>
